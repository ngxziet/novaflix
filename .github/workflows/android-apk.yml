name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and verify signed APK
        working-directory: android
        env:
          NOVAFLIX_KEYSTORE_BASE64: ${{ secrets.NOVAFLIX_KEYSTORE_BASE64 }}
          NOVAFLIX_KEYSTORE_PASSWORD: ${{ secrets.NOVAFLIX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${NOVAFLIX_KEYSTORE_BASE64}" || -z "${NOVAFLIX_KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Configure the NovaFlix Android signing secrets before building a release."
            exit 1
          fi

          export NOVAFLIX_KEYSTORE_FILE
          NOVAFLIX_KEYSTORE_FILE="$(mktemp "${RUNNER_TEMP}/novaflix-signing.XXXXXX.p12")"
          trap 'rm -f -- "$NOVAFLIX_KEYSTORE_FILE"' EXIT
          printf '%s' "$NOVAFLIX_KEYSTORE_BASE64" | base64 --decode > "$NOVAFLIX_KEYSTORE_FILE"
          unset NOVAFLIX_KEYSTORE_BASE64

          bash ./gradlew --no-daemon :app:assembleRelease :app:lintRelease \
            -PnovaVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PnovaVersionName="1.0.${GITHUB_RUN_NUMBER}"

          apk="${RUNNER_TEMP}/NovaFlix.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer="$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk")"
          if ! grep -Fxq 'Signer #1 certificate SHA-256 digest: 397265c5c608c0d21d99d9062fa2db9fdf1b2b418de0e63c8dcdeee08bfd5dfb' <<< "$signer"; then
            echo "::error::This APK was not signed with the original NovaFlix certificate."
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NovaFlix-Android-${{ github.run_number }}
          path: ${{ runner.temp }}/NovaFlix.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: novaflix-android-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NovaFlix-Android-${{ github.run_number }}
          path: ${{ runner.temp }}
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_version="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | capture("^android-v1\\.0\\.(?<number>[0-9]+)$").number | tonumber] | max // 0')"
          if (( GITHUB_RUN_NUMBER <= latest_version )); then
            echo "Android release 1.0.${latest_version} is already available."
            exit 0
          fi

          version="1.0.${GITHUB_RUN_NUMBER}"
          gh release create "android-v${version}" "${RUNNER_TEMP}/NovaFlix.apk" \
            --target "$GITHUB_SHA" --latest --title "NovaFlix Android ${version}" \
            --notes 'Tải NovaFlix.apk để cài hoặc cập nhật trên Android 8 trở lên.'
