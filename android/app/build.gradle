plugins {
    id 'com.android.application' version '8.11.1'
}

def keystorePath = providers.environmentVariable('NOVAFLIX_KEYSTORE_FILE')
def keystorePassword = providers.environmentVariable('NOVAFLIX_KEYSTORE_PASSWORD')

android {
    namespace 'io.github.ngxziet.novaflix'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'io.github.ngxziet.novaflix'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('novaVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('novaVersionName').getOrElse('1.0.0')
    }

    signingConfigs {
        if (keystorePath.isPresent() && keystorePassword.isPresent()) {
            release {
                storeFile file(keystorePath.get())
                storePassword keystorePassword.get()
                keyAlias 'novaflix'
                keyPassword keystorePassword.get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}
